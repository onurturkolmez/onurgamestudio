:root{--accent:#F2B544}
html,body{margin:0;height:100%;background:#020308;color:#E8EAF0;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif}
#app{position:fixed;inset:0;background:#020308}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:absolute;visibility:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0}
button{font-family:inherit}
button:focus-visible{outline:2px solid #6FC3FF;outline-offset:2px}
.ctl{position:absolute;top:calc(16px + var(--st, env(safe-area-inset-top)));right:16px;display:none;gap:10px}
.ctl.on{display:flex}
.rb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(10,14,24,.7);color:#E8EAF0;border:1px solid rgba(255,255,255,.18);padding:0}
.rb.lit{background:var(--accent);color:#05070D;border:0;box-shadow:0 0 20px rgba(242,181,68,.4)}
#start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;box-sizing:border-box;padding:32px 24px calc(48px + var(--sb, env(safe-area-inset-bottom)));background:linear-gradient(180deg,rgba(2,3,8,0) 35%,rgba(2,3,8,.88) 78%)}
#start.off{display:none}
#notice{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box;padding:24px 16px calc(24px + var(--sb, env(safe-area-inset-bottom)));background:rgba(2,3,8,.74)}
#notice.off{display:none}
.nbox{width:100%;max-width:440px;box-sizing:border-box;background:#0B101B;border:1px solid rgba(242,181,68,.4);border-radius:20px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.nbox h2{margin:0;font-size:20px;font-weight:700}
.nbox ul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:9px;font-size:14px;line-height:1.45;color:#C9CFDB}
.nlink{background:none;border:0;color:#9AA3B5;font-size:12px;text-decoration:underline;cursor:pointer;min-height:44px;padding:0}
.st{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.kick{font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:600}
h1{margin:0;font-size:44px;line-height:1;font-weight:700}
.lead{margin:0;font-size:15px;line-height:1.5;color:#B7BECC}
.go{margin-top:8px;min-height:56px;border-radius:999px;border:0;background:var(--accent);color:#05070D;font-size:15px;font-weight:700;letter-spacing:.12em;cursor:pointer}
.go2{min-height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#C9CFDB;font-size:13px;cursor:pointer}
.tip{font-size:11px;color:#7D869A;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.xbtn{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:none;align-items:center;justify-content:center;padding:0;cursor:pointer;background:rgba(255,255,255,.07);color:#C9CFDB;border:1px solid rgba(255,255,255,.16);transition:background .15s,color .15s;will-change:transform}
.xbtn::before{content:"";position:absolute;inset:-6px}
.xbtn.on{display:flex}
.xbtn:active{background:rgba(242,181,68,.25);color:#fff}
.ib{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:19px}
</style>

      DEC.forEach(function (d, i) {
        var y = by + 6 + i * 22, top = d[1] === mxv;
        g.fillStyle = '#B7BECC'; g.font = '500 11px ' + FONT; g.textAlign = 'left';
        g.fillText(d[0], cx0 + 16, y + 11);
        g.fillStyle = 'rgba(255,255,255,0.08)'; rrect(g, cx0 + 16 + lw, y + 2, bw, 10, 5); g.fill();
        var bl = Math.max(10, bw * (d[1] / 20) * grow);
        g.fillStyle = top ? ACCENT : 'rgba(232,234,240,0.55)'; rrect(g, cx0 + 16 + lw, y + 2, bl, 10, 5); g.fill();
        g.fillStyle = top ? ACCENT : '#E8EAF0'; g.font = '500 11px ' + MONO; g.textAlign = 'right';
        g.fillText(fmt(d[1], 1) + ' ' + U.kms, cx0 + cw - 16, y + 11);
      });
      g.textAlign = 'left'; g.fillStyle = '#8C95A8'; g.font = '400 10px ' + FONT;
      g.fillText(inf.note, cx0 + 16, by + 6 + DEC.length * 22 + 10);
    }
    g.fillStyle = '#8C95A8'; g.font = '500 10px ' + FONT; g.textAlign = 'left';
    g.fillText(isTour ? U.footTour : U.footSingle, cx0 + 16, cy0 + ch - 12);
    g.globalAlpha = 1;
    placeClose([cx0 + cw - 46, cy0 + 8]);
  }

  // Gömülü yazı tiplerini tuval (canvas) için önceden yükle
  try { ['500 12px "Space Grotesk"', '700 12px "Space Grotesk"', '500 12px "JetBrains Mono"', '700 12px "JetBrains Mono"'].forEach(function (f) { document.fonts.load(f); }); } catch (e) {}
  ui();
  (function loop() { draw(); requestAnimationFrame(loop); })();
})();
